<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Kira Wiki · 知识晶格</title>
<link rel="stylesheet" href="style.css?v=1.5.0">
<script>
  /* 主题在首帧之前定下来，避免闪白；尊重系统偏好 */
  (function () {
    try {
      var saved = localStorage.getItem("kw-theme");
      var sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : (sys ? "light" : "dark");
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  })();
</script>
</head>
<body>

    <g id="i-link"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></g>
    <g id="i-grid"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></g>

<!-- ═══════════ 背景：晶格画布 + 光晕 ═══════════ -->
<div class="stage" aria-hidden="true">
  <canvas id="lattice"></canvas>
  <div class="grain"></div>
  <div class="glow" data-par="0.02"></div>
  <div class="scan"></div>
</div>

<!-- ═══════════ 开屏 ═══════════ -->
<div class="boot" id="boot">
  <div class="boot-mark">
    <svg class="boot-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
      <use href="#i-library"/>
    </svg>
    <div class="boot-grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="boot-line">COMPILING KNOWLEDGE LATTICE</div>
  <div class="boot-bar"><span></span></div>
</div>

<!-- ═══════════ 主体 ═══════════ -->
<main class="shell" id="shell">

  <header class="brand" data-reveal>
    <div class="brand-row">
      <span class="mark"><svg viewBox="0 0 24 24"><use href="#i-library"/></svg></span>
      <span class="kicker">KIRA · WIKI</span>
    </div>
    <h1 class="display">
      <span class="display-line">知识晶格</span>
      <span class="display-line alt">LATTICE</span>
    </h1>
    <div class="brand-meta">
      <span class="tag-mono" id="kbPath">—</span>
      <span class="dot-sep"></span>
      <span class="tag-mono" id="kbStamp">—</span>
    </div>
  </header>

  <nav class="nav" data-reveal>
    <div class="nav-head"><svg viewBox="0 0 24 24"><use href="#i-layers"/></svg><span class="kicker">结构 / SECTIONS</span></div>
    <ul class="nav-list" id="navList"></ul>
    <div class="nav-foot">
      <div class="metric" data-metric="raw"><span class="metric-num" id="mRaw">0</span><span class="metric-lab">素材</span></div>
      <div class="metric" data-metric="pages"><span class="metric-num" id="mPages">0</span><span class="metric-lab">页面</span></div>
      <div class="metric" data-metric="links"><span class="metric-num" id="mLinks">0</span><span class="metric-lab">链接</span></div>
    </div>
  </nav>

  <section class="deck" data-reveal>
    <div class="hud">
      <button class="icobtn" id="btnSearch" title="搜索 (/)"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg></button>
      <div class="modelpick">
        <button class="modelchip" id="modelChip" title="点开选择生成 / 问答所用模型（选中即生效）">
          <svg viewBox="0 0 24 24"><use href="#i-sparkle"/></svg>
          <span class="mc-label" id="modelLabel">默认 LLM</span>
          <svg class="mc-caret" viewBox="0 0 24 24"><use href="#i-caret"/></svg>
        </button>
        <div class="menu" id="modelMenu" hidden>
          <div class="menu-head"><span>生成 / 问答模型</span><span>选中即生效</span></div>
          <div class="menu-list" id="modelList"></div>
        </div>
      </div>
      <div class="kbpick" id="kbPickWrap" hidden>
        <svg viewBox="0 0 24 24"><use href="#i-library"/></svg>
        <select id="kbPicker" title="切换知识库"></select>
      </div>
      <input id="searchInput" class="search" type="search" placeholder="搜索页面 / 实体 / 概念…（回车＝提问）" spellcheck="false" autocomplete="off">
      <button class="llmtoggle" id="llmToggle" aria-pressed="true" title="检索时是否调用 LLM 生成答案：关掉＝只返回命中页">LLM</button>
      <div class="hud-spacer"></div>
      <button class="icobtn" id="btnAsk" title="问知识库 (A)"><svg viewBox="0 0 24 24"><use href="#i-sparkle"/></svg></button>
      <button class="icobtn" id="btnLint" title="体检 (L)"><svg viewBox="0 0 24 24"><use href="#i-pulse"/></svg></button>
      <button class="icobtn" id="btnReindex" title="重建索引 (G)"><svg viewBox="0 0 24 24"><use href="#i-refresh"/></svg></button>
      <button class="icobtn" id="btnSettings" title="设置 (S)"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
      <button class="icobtn" id="btnNew" title="新建页面 (N)"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
      <button class="icobtn" id="btnTheme" title="切换主题"><svg viewBox="0 0 24 24"><use href="#i-moon"/></svg></button>
    </div>

    <div class="tip" id="tip" hidden>
      <svg viewBox="0 0 24 24"><use href="#i-info"/></svg>
      <span id="tipText"></span>
      <button class="kbs-btn" id="tipAction" hidden>初始化知识库</button>
    </div>

    <div class="empty" id="empty">
      <svg class="empty-icon" viewBox="0 0 24 24"><use href="#i-grid"/></svg>
      <p class="empty-lead" id="emptyLead">正在读取知识库…</p>
      <p class="empty-sub" id="emptySub"></p>

      <!-- 自举：无库/未初始化时的引导卡（纯页内表单，不用原生 prompt） -->
      <div class="kb-setup" id="kbSetup" hidden>
        <div class="kbs-row">
          <label class="kbs-lab" for="kbsName">名称</label>
          <input id="kbsName" class="kbs-input" type="text" placeholder="默认知识库" spellcheck="false" autocomplete="off">
        </div>
        <div class="kbs-row">
          <label class="kbs-lab" for="kbsPath">目录</label>
          <input id="kbsPath" class="kbs-input mono" type="text" placeholder="data/kw" spellcheck="false" autocomplete="off">
        </div>
        <div class="kbs-actions">
          <button class="kbs-btn primary" id="kbsCreate">创建 / 接管这个目录</button>
          <button class="kbs-btn" id="kbsRetry">重新检测</button>
        </div>
        <p class="kbs-hint">目录不存在会自动创建；指向已有的 Obsidian 库时，里面的笔记会一并载入（可读可写），插件不会擅自改动它们。</p>
      </div>
    </div>

    <div class="legend" id="legend">
      <span class="lg"><i class="sw sw-s"></i>来源</span>
      <span class="lg"><i class="sw sw-e"></i>实体</span>
      <span class="lg"><i class="sw sw-c"></i>概念</span>
      <span class="lg"><i class="sw sw-a"></i>分析</span>
      <span class="lg" id="lgExt" hidden><i class="sw" style="background:var(--ext)"></i>外部笔记</span>
      <span class="lg hint">滚轮缩放 · 拖拽节点 · 双击聚焦</span>
    </div>
  </section>
</main>

<!-- ═══════════ 阅读 / 编辑抽屉 ═══════════ -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-grip" id="drawerGrip"></div>
  <header class="drawer-head">
    <div class="dh-left">
      <span class="chip" id="pgSection">—</span>
      <h2 class="drawer-title" id="pgTitle">—</h2>
    </div>
    <div class="dh-right">
      <button class="icobtn tiny" id="btnTabRead" title="阅读"><svg viewBox="0 0 24 24"><use href="#i-book"/></svg></button>
      <button class="icobtn tiny" id="btnTabEdit" title="编辑 (E)"><svg viewBox="0 0 24 24"><use href="#i-pencil"/></svg></button>
      <button class="icobtn tiny" id="btnSave" title="保存 (⌘/Ctrl+S)"><svg viewBox="0 0 24 24"><use href="#i-save"/></svg></button>
      <button class="icobtn tiny danger" id="btnDelete" title="删除页面"><svg viewBox="0 0 24 24"><use href="#i-trash"/></svg></button>
      <button class="icobtn tiny" id="btnClose" title="关闭 (Esc)"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
    </div>
  </header>
  <div class="drawer-meta">
    <span class="tag-mono" id="pgPath">—</span>
    <span class="tag-mono" id="pgSize">—</span>
    <span class="tag-mono dirty" id="pgDirty">已同步</span>
  </div>
  <article class="reader" id="reader"></article>
  <textarea class="editor" id="editor" spellcheck="false" hidden></textarea>
  <footer class="drawer-foot">
    <span class="tag-mono" id="pgCount">0 字</span>
    <span class="dot-sep"></span>
    <span class="tag-mono" id="pgUpdated">—</span>
  </footer>
</aside>

<!-- ═══════════ 体检 / 问答 面板 ═══════════ -->
<section class="sheet" id="sheet" aria-hidden="true">
  <header class="sheet-head">
    <span class="chip" id="sheetKind">体检</span>
    <button class="icobtn tiny" id="btnSheetClose" title="关闭"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
  </header>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<!-- ═══════════ 底栏日志 ticker ═══════════ -->
<footer class="ticker" id="ticker">
  <span class="ticker-key"><svg viewBox="0 0 24 24"><use href="#i-clock"/></svg>LOG</span>
  <div class="ticker-track"><div class="ticker-run" id="tickerRun"></div></div>
</footer>

<!-- ═══════════ 页内模态框（原生 prompt/confirm 在插件 iframe 里会被沙箱吞掉） ═══════════ -->
<div class="modal" id="modal" hidden aria-hidden="true">
  <div class="modal-mask" id="modalMask"></div>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 class="modal-title" id="modalTitle">—</h3>
    <p class="modal-text" id="modalText" hidden></p>
    <div class="modal-fields" id="modalFields"></div>
    <div class="modal-actions">
      <button class="kbs-btn" id="modalCancel">取消</button>
      <button class="kbs-btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="graph.js?v=1.5.0"></script>
<script src="app.js?v=1.5.0"></script>
</body>
</html>
